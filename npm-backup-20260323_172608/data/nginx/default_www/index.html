<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lost in Middle-earth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
            color: #d4af37;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            max-width: 600px;
            padding: 40px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #d4af37;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.3);
        }
        
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.5);
            letter-spacing: 2px;
        }
        
        .rune {
            font-size: 4em;
            margin-bottom: 20px;
            opacity: 0.7;
        }
        
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 15px;
            color: #c9c9c9;
        }
        
        .quote {
            font-style: italic;
            font-size: 1em;
            margin: 30px 0;
            padding: 20px;
            border-left: 3px solid #d4af37;
            color: #d4af37;
            background: rgba(212, 175, 55, 0.1);
        }
        
        .domain {
            font-family: 'Courier New', monospace;
            color: #ff6b6b;
            background: rgba(255, 107, 107, 0.1);
            padding: 5px 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        
        a {
            color: #d4af37;
            text-decoration: none;
            border-bottom: 1px solid transparent;
            transition: border-bottom 0.3s;
        }
        
        a:hover {
            border-bottom: 1px solid #d4af37;
        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.9em;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="rune">⚔️</div>
        <h1>Lost in Middle-earth</h1>
        
        <p>The path you seek does not exist in these lands.</p>
        
        <div class="quote">
            "Not all those who wander are lost..."<br>
            <span style="font-size: 0.9em;">— but you might be.</span>
        </div>
        
        <p>The subdomain <span class="domain" id="subdomain"></span> has not been mapped to any realm.</p>
        
        <p style="margin-top: 30px;">
            Perhaps you were looking for one of these instead?
        </p>
        
        <div style="margin: 20px 0;">
            <a href="https://google.com" target="_blank">Google</a> •
            <a href="https://duckduckgo.com" target="_blank">DuckDuckGo</a>
        </div>
        
        <div class="footer">
            <p>middl.earth © 2025</p>
        </div>
    </div>
    
    <script>
        // Display the current subdomain
        const hostname = window.location.hostname;
        document.getElementById('subdomain').textContent = hostname;
    </script>
</body>
</html>
